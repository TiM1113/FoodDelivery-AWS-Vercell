name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @food-delivery/shared build

      - name: Type check shared
        run: pnpm --filter @food-delivery/shared typecheck

      - name: Type check backend
        run: pnpm --filter @food-delivery/backend exec tsc --noEmit

  build:
    name: Build check
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @food-delivery/shared build

      - name: Build frontend
        run: pnpm --filter @food-delivery/frontend build

      - name: Build admin
        run: pnpm --filter @food-delivery/admin build
