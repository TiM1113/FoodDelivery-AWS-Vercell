name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @food-delivery/shared build

      - name: Type check shared
        run: pnpm --filter @food-delivery/shared typecheck

      - name: Type check backend
        run: pnpm --filter @food-delivery/backend exec tsc --noEmit

      - name: Type check apps/web
        run: pnpm --filter @food-delivery/web exec tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @food-delivery/shared build

      - name: Lint apps/web
        run: pnpm --filter @food-delivery/web lint

  test-web:
    name: Test (web)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @food-delivery/shared build

      - name: Run tests with coverage
        run: pnpm --filter @food-delivery/web test -- --coverage

  test-backend:
    name: Test (backend)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @food-delivery/shared build

      - name: Run backend tests
        run: pnpm --filter @food-delivery/backend test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    # E2E requires backend + database secrets — skip when not configured
    if: ${{ vars.E2E_ENABLED == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @food-delivery/shared build

      - name: Install Playwright browsers
        run: pnpm --filter @food-delivery/web exec playwright install --with-deps chromium

      - name: Start backend server
        run: pnpm --filter @food-delivery/backend dev &
        env:
          PORT: 4000
          NODE_ENV: test
          CORS_ALLOWED_ORIGINS: http://localhost:3000

      - name: Wait for backend
        run: npx wait-on http://localhost:4000 --timeout 30000

      - name: Run E2E tests
        run: pnpm --filter @food-delivery/web test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  build:
    name: Build check
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test-web, test-backend]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @food-delivery/shared build

      - name: Build backend
        run: pnpm --filter @food-delivery/backend build

      - name: Build apps/web
        run: pnpm --filter @food-delivery/web build

      - name: Verify backend build output
        run: |
          test -f backend/.vercel/output/functions/api/index.func/index.js || { echo "Missing backend function bundle"; exit 1; }
          test -f backend/.vercel/output/config.json || { echo "Missing build output config"; exit 1; }
