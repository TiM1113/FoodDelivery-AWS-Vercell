name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @food-delivery/shared build

      - name: Type check shared
        run: pnpm --filter @food-delivery/shared typecheck

      - name: Type check backend
        run: pnpm --filter @food-delivery/backend exec tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @food-delivery/shared build

      - name: Lint apps/web
        run: pnpm --filter @food-delivery/web lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @food-delivery/shared build

      - name: Run tests with coverage
        run: pnpm --filter @food-delivery/web test -- --coverage

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    # E2E tests require backend API — non-blocking until test env is set up
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @food-delivery/shared build

      - name: Install Playwright browsers
        run: pnpm --filter @food-delivery/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @food-delivery/web test:e2e

  build:
    name: Build check
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @food-delivery/shared build

      - name: Build admin
        run: pnpm --filter @food-delivery/admin build

      - name: Build apps/web
        run: pnpm --filter @food-delivery/web build
