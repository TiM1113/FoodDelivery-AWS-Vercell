name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @food-delivery/shared build

      - name: Type check shared
        run: pnpm --filter @food-delivery/shared typecheck

      - name: Type check backend
        run: pnpm --filter @food-delivery/backend exec tsc --noEmit

      - name: Type check apps/web
        run: pnpm --filter @food-delivery/web exec tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @food-delivery/shared build

      - name: Lint apps/web
        run: pnpm --filter @food-delivery/web lint

  test-web:
    name: Test (web)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @food-delivery/shared build

      - name: Run tests with coverage
        run: pnpm --filter @food-delivery/web test -- --coverage

  test-backend:
    name: Test (backend)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @food-delivery/shared build

      - name: Run backend tests
        run: pnpm --filter @food-delivery/backend test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @food-delivery/shared build

      - name: Install Playwright browsers
        run: pnpm --filter @food-delivery/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @food-delivery/web test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  build:
    name: Build check
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test-web, test-backend]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @food-delivery/shared build

      - name: Build backend
        run: pnpm --filter @food-delivery/backend build

      - name: Build apps/web
        run: pnpm --filter @food-delivery/web build

      - name: Verify backend build output
        run: |
          test -f backend/.vercel/output/functions/api/index.func/index.js || { echo "Missing backend function bundle"; exit 1; }
          test -f backend/.vercel/output/config.json || { echo "Missing build output config"; exit 1; }
